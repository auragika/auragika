# Netlify doesn't build from git: `ignore` exits 0, which skips every push and deploy
# preview. Production deploys happen only from Actions → Deploy (.github/workflows/deploy.yml),
# which builds the site and uploads it. Headers live in static/_headers so they apply to
# those uploads; the Hugo version lives in the workflows.
[build]
  publish = "public"
  command = "hugo --minify"
  ignore  = "exit 0"

# Production deploy, by hand: Actions → Deploy → Run workflow. Ships one GitHub Release (published
# by ci.yml's `release` job after every check passed on main): its site.zip goes to Netlify as it
# is, so what goes live is exactly what CI built and checked. Leave the tag empty for the latest
# release; pick an older tag to roll back. The Rollback workflow (rollback.yml) calls this one
# with the release that was live before the current one.
# Netlify doesn't build from the repo (netlify.toml `ignore`).
# Secrets: NETLIFY_AUTH_TOKEN (Netlify → User settings → Applications → Personal access tokens)
# and NETLIFY_SITE_ID (Site configuration → Site details → Site ID).
name: Deploy
# Rollback runs this inside its own run, which keeps Rollback's name.
run-name: Deploy ${{ inputs.tag || 'the latest release' }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (empty = latest release)
        required: false
        default: ''
  workflow_call:
    inputs:
      tag:
        description: Release tag to deploy
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One production deploy at a time, whether it came from Deploy or Rollback.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production # lists each deploy under the repo's Deployments
      url: ${{ steps.netlify.outputs.live_url || 'https://auragika.com' }}
    steps:
      - name: Pick the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [ -n "$TAG" ] || TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # The deploy scripts come from this workflow's commit, so older releases deploy the same way.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - name: Download the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern site.zip
          rm -rf public && unzip -q site.zip -d public
      # What's live now (read from the page), for the summary and to tell an update from a rollback.
      - name: Find the live release
        run: echo "FROM=$(scripts/live-release.sh)" >> "$GITHUB_ENV"
      - name: Name the Netlify deploy
        run: echo "DEPLOY_TITLE=$TAG ($(scripts/deploy-kind.sh "${FROM:-}" "$TAG"), by $GITHUB_ACTOR)" >> "$GITHUB_ENV"
      - id: netlify
        run: scripts/deploy-netlify.sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      # 🚀/⏪/🔁/❌ heading; release, commit, what was live, who, how long, the live and permalink
      # URLs; then the merged PRs since the live release (or those taken away, on a rollback) and
      # how to undo. Also written when the deploy failed.
      - name: Summarise the deploy
        if: always() && env.TAG != ''
        run: scripts/deploy-summary.sh >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          LIVE_URL: ${{ steps.netlify.outputs.live_url }}
          PERMALINK: ${{ steps.netlify.outputs.permalink }}
          DEPLOY_ID: ${{ steps.netlify.outputs.deploy_id }}
